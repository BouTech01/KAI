<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - To-Do List App</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📝 TaskMaster</h1>
                <p>Your Personal Task Manager</p>
            </div>
            <div class="header-stats">
                <div class="stat">
                    <span class="stat-label">Total</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Progress</span>
                    <span class="stat-value" id="progress">0%</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <select id="prioritySelect" class="priority-select">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                    <input 
                        type="date" 
                        id="dueDate" 
                        class="due-date-input"
                    >
                    <button id="addBtn" class="add-btn">➕ Add Task</button>
                </div>
            </div>

            <!-- Filter and Sort Section -->
            <div class="controls-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <button class="filter-btn" data-filter="high">🔴 High</button>
                </div>
                <div class="sort-buttons">
                    <select id="sortSelect" class="sort-select">
                        <option value="date-added">Date Added</option>
                        <option value="priority">Priority</option>
                        <option value="due-date">Due Date</option>
                        <option value="alphabetical">Alphabetical</option>
                    </select>
                </div>
            </div>

            <!-- Tasks List -->
            <div class="tasks-container">
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">🎯</div>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
                <ul id="tasksList" class="tasks-list">
                    <!-- Tasks will be rendered here -->
                </ul>
            </div>
        </main>

        <!-- Action Buttons -->
        <footer class="footer">
            <button id="clearCompleted" class="action-btn danger">🗑️ Clear Completed</button>
            <button id="exportBtn" class="action-btn primary">📥 Export Tasks</button>
            <button id="importBtn" class="action-btn primary">📤 Import Tasks</button>
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </footer>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Task</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <input 
                    type="text" 
                    id="editTaskInput" 
                    class="modal-input" 
                    placeholder="Task description"
                >
                <select id="editPrioritySelect" class="modal-select">
                    <option value="low">Low Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <input 
                    type="date" 
                    id="editDueDate" 
                    class="modal-input"
                >
            </div>
            <div class="modal-footer">
                <button id="cancelBtn" class="action-btn">Cancel</button>
                <button id="saveBtn" class="action-btn primary">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="todo.js"></script>
</body>
</html>
